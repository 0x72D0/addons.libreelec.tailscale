name: Release add-on

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release or create, for example v0.1.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag="${EVENT_TAG#refs/tags/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag in the form vMAJOR.MINOR.PATCH, got: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git fetch --tags --force origin
          if ! git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null 2>&1; then
            if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
              echo "Release tag '$tag' does not exist on origin." >&2
              exit 1
            fi

            source_version="$(python -c 'from xml.etree import ElementTree; print(ElementTree.parse("addon.xml").getroot().get("version"))')"
            requested_version="${tag#v}"
            if [[ "$source_version" != "$requested_version" ]]; then
              echo "Cannot create '$tag': addon.xml contains version '$source_version'." >&2
              echo "Update addon.xml or enter the matching tag." >&2
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$tag" --message "Release $tag"
            git push origin "refs/tags/$tag"
          fi
          git checkout --detach "refs/tags/$tag"

      - name: Validate and package release
        run: >-
          python scripts/package_addon.py
          --output dist
          --expected-version "${{ steps.version.outputs.version }}"

      - name: Validate Kodi release ZIP layout
        shell: bash
        run: |
          package="dist/service.tailscale-${{ steps.version.outputs.version }}.zip"
          test -f "$package"
          python - "$package" <<'PY'
          import sys
          import zipfile

          package = sys.argv[1]
          with zipfile.ZipFile(package) as archive:
              entries = archive.namelist()

          if "service.tailscale/addon.xml" not in entries:
              raise SystemExit("The release ZIP does not contain service.tailscale/addon.xml")

          nested_archives = [entry for entry in entries if entry.lower().endswith(".zip")]
          if nested_archives:
              raise SystemExit(
                  "The release ZIP contains nested ZIP files: "
                  + ", ".join(nested_archives)
              )

          print("Kodi release ZIP layout: OK")
          PY

      - name: Publish versioned Kodi ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          asset="dist/service.tailscale-${{ steps.version.outputs.version }}.zip"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --verify-tag \
              --title "Tailscale add-on $tag" \
              --generate-notes
          fi